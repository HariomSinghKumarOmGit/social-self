<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Social Agent — Post Feed</title>
  <meta name="description" content="Social media post feed with analytics and interaction data">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep:    #08090d;
      --bg-surface: #0f1118;
      --bg-card:    #151820;
      --bg-hover:   #1a1e2a;
      --border:     #1f2535;
      --border-hl:  #2d3548;
      --text:       #e2e8f4;
      --text-muted: #7a8599;
      --text-dim:   #545e72;
      --accent:     #4f8ff7;
      --accent-glow: rgba(79, 143, 247, 0.12);
      --ig-pink:    #E1306C;
      --ig-grad:    linear-gradient(135deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
      --tw-blue:    #1DA1F2;
      --yt-red:     #FF0000;
      --green:      #2dd4a8;
      --amber:      #f5a623;
      --radius:     14px;
      --radius-sm:  8px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg-deep);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Top Nav ── */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 28px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(12px);
    }
    .topbar .brand {
      font-weight: 700;
      font-size: 17px;
      letter-spacing: -0.01em;
    }
    .topbar .brand span { color: var(--accent); }
    .nav-links { display: flex; gap: 6px; }
    .nav-links a {
      color: var(--text-muted);
      text-decoration: none;
      padding: 7px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.2s;
    }
    .nav-links a:hover,
    .nav-links a.active {
      background: var(--accent-glow);
      color: var(--accent);
    }
    .topbar-right { display: flex; gap: 10px; align-items: center; }
    .scrape-btn {
      background: rgba(45, 212, 168, 0.12);
      border: 1px solid rgba(45, 212, 168, 0.35);
      color: var(--green);
      border-radius: 999px;
      padding: 7px 14px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .scrape-btn:hover:not(:disabled) {
      background: rgba(45, 212, 168, 0.2);
      border-color: var(--green);
    }
    .scrape-btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .beast-btn {
      border: none; cursor: pointer; border-radius: 999px; padding: 7px 14px;
      font-size: 12px; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase;
      color: #fff;
      background: linear-gradient(135deg, #ff6b35, #f72585 55%, #7209b7);
      box-shadow: 0 4px 18px rgba(247, 37, 133, 0.35);
    }
    .beast-btn:disabled { opacity: 0.65; cursor: wait; }

    /* ── Filter Bar ── */
    .filter-bar {
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 16px 28px;
      flex-wrap: wrap;
    }
    .filter-bar .search-box {
      flex: 1;
      min-width: 200px;
      max-width: 400px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 999px;
      padding: 9px 18px;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }
    .filter-bar .search-box:focus { border-color: var(--accent); }
    .filter-bar .search-box::placeholder { color: var(--text-dim); }
    .pill-group { display: flex; gap: 4px; }
    .pill-btn {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 999px;
      padding: 7px 16px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    .pill-btn:hover { border-color: var(--border-hl); color: var(--text); }
    .pill-btn.active {
      background: var(--accent-glow);
      border-color: var(--accent);
      color: var(--accent);
    }
    .pill-btn.ig.active  { background: rgba(225,48,108,0.12); border-color: var(--ig-pink); color: var(--ig-pink); }
    .pill-btn.tw.active  { background: rgba(29,161,242,0.12); border-color: var(--tw-blue); color: var(--tw-blue); }
    .pill-btn.yt.active  { background: rgba(255,0,0,0.10);    border-color: var(--yt-red);  color: var(--yt-red);  }
    .sort-select {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 999px;
      padding: 7px 14px;
      font-size: 12px;
      outline: none;
    }
    .author-bar {
      display: flex;
      gap: 6px;
      padding: 0 28px 12px;
      flex-wrap: wrap;
    }
    .author-bar.hidden { display: none; }
    .stats-summary {
      margin-left: auto;
      display: flex;
      gap: 16px;
      font-size: 12px;
      color: var(--text-dim);
    }
    .stats-summary strong { color: var(--text-muted); }

    /* ── Feed Layout ── */
    .feed-container {
      max-width: 780px;
      margin: 0 auto;
      padding: 0 20px 60px;
    }

    /* ── Post Card ── */
    .post-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 16px;
      overflow: hidden;
      transition: border-color 0.25s, box-shadow 0.25s;
    }
    .post-card:hover {
      border-color: var(--border-hl);
      box-shadow: 0 4px 24px rgba(0,0,0,0.3);
    }

    /* Card Header */
    .post-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 18px 0;
    }
    .platform-badge {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }
    .platform-badge.instagram { background: var(--ig-grad); }
    .platform-badge.twitter   { background: var(--tw-blue); }
    .platform-badge.youtube   { background: var(--yt-red); }
    .post-meta { flex: 1; }
    .post-meta .author {
      font-weight: 600;
      font-size: 14px;
      color: var(--text);
    }
    .post-meta .platform-name {
      font-size: 11px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .post-score {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 600;
      color: var(--green);
    }
    .post-score.mid { color: var(--amber); }
    .post-score.low { color: var(--text-dim); }

    /* Post Link — The Main Attraction */
    .post-link-wrap {
      padding: 12px 18px 6px;
    }
    .post-link {
      display: block;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      text-decoration: none;
      color: var(--accent);
      font-size: 13px;
      font-weight: 500;
      transition: all 0.2s;
      word-break: break-all;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .post-link:hover {
      background: var(--accent-glow);
      border-color: var(--accent);
    }
    .post-link .link-icon {
      font-size: 16px;
      flex-shrink: 0;
    }
    .post-link .link-text {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .post-link .link-arrow {
      color: var(--text-dim);
      font-size: 12px;
      flex-shrink: 0;
      transition: transform 0.2s;
    }
    .post-link:hover .link-arrow { transform: translateX(3px); }

    /* Content Preview */
    .post-content {
      padding: 10px 18px;
      font-size: 13.5px;
      line-height: 1.55;
      color: var(--text-muted);
    }

    /* Media Thumbnail */
    .post-media {
      padding: 0 18px 8px;
    }
    .post-media img {
      width: 100%;
      max-height: 300px;
      object-fit: cover;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
    }

    /* ── Analytics Bar — The Interaction Breakdown ── */
    .analytics-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));
      gap: 1px;
      background: var(--border);
      border-top: 1px solid var(--border);
    }
    .stat-cell {
      background: var(--bg-card);
      padding: 12px 14px;
      text-align: center;
    }
    .stat-cell:first-child { border-radius: 0 0 0 var(--radius); }
    .stat-cell:last-child  { border-radius: 0 0 var(--radius) 0; }
    .stat-value {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.02em;
    }
    .stat-label {
      font-size: 10px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-top: 2px;
    }

    /* Specific stat colors on hover */
    .stat-cell.likes:hover   .stat-value { color: #ff4d6a; }
    .stat-cell.comments:hover .stat-value { color: var(--accent); }
    .stat-cell.shares:hover  .stat-value { color: var(--green); }
    .stat-cell.saves:hover   .stat-value { color: var(--amber); }
    .stat-cell.views:hover   .stat-value { color: #a78bfa; }
    .stat-cell { transition: background 0.15s; cursor: default; }
    .stat-cell:hover { background: var(--bg-hover); }

    /* ── Action Row ── */
    .post-actions {
      display: flex;
      gap: 8px;
      padding: 10px 18px 14px;
      border-top: 1px solid var(--border);
    }
    .action-btn {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: var(--radius-sm);
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    .action-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-glow);
    }
    .action-btn.approve {
      background: rgba(45,212,168,0.08);
      border-color: rgba(45,212,168,0.3);
      color: var(--green);
    }
    .action-btn.approve:hover {
      background: rgba(45,212,168,0.16);
      border-color: var(--green);
    }
    .action-btn.reject {
      color: #ff6b6b;
      border-color: rgba(255,107,107,0.2);
    }
    .action-btn.reject:hover {
      background: rgba(255,107,107,0.08);
      border-color: #ff6b6b;
    }
    .post-status {
      margin-left: auto;
      font-size: 11px;
      padding: 5px 12px;
      border-radius: 999px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .post-status.pending  { background: rgba(245,166,35,0.12); color: var(--amber); }
    .post-status.approved { background: rgba(45,212,168,0.12); color: var(--green); }
    .post-status.posted   { background: rgba(79,143,247,0.12); color: var(--accent); }
    .post-status.rejected { background: rgba(255,107,107,0.08); color: #ff6b6b; }

    /* ── Empty State ── */
    .empty-state {
      text-align: center;
      padding: 80px 20px;
      color: var(--text-dim);
    }
    .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
    .empty-state p { font-size: 14px; }

    /* ── Loading ── */
    .loading {
      text-align: center;
      padding: 60px;
      color: var(--text-dim);
      font-size: 14px;
    }
    .loading .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Responsive ── */
    @media (max-width: 640px) {
      .filter-bar { padding: 12px 16px; }
      .feed-container { padding: 0 12px 40px; }
      .analytics-bar { grid-template-columns: repeat(3, 1fr); }
      .topbar { padding: 12px 16px; }
      .stats-summary { display: none; }
    }

    /* ── Modal ── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.78);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      z-index: 200;
      backdrop-filter: blur(10px);
    }
    .modal-overlay.open { display: flex; }
    .modal-card {
      width: min(720px, 100%);
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 18px 60px rgba(0,0,0,0.45);
      overflow: hidden;
    }
    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-surface);
    }
    .modal-title { font-size: 13px; font-weight: 700; letter-spacing: -0.01em; }
    .modal-close {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 10px;
      padding: 6px 10px;
      cursor: pointer;
    }
    .modal-body { padding: 16px; }
    .schedule-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
    .time-btn {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 12px;
      padding: 10px 12px;
      cursor: pointer;
      transition: all 0.2s;
      font-weight: 600;
      font-size: 12.5px;
      text-align: left;
    }
    .time-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-glow); }
    .time-btn.selected { border-color: var(--green); color: var(--green); background: rgba(45,212,168,0.10); }
    .time-btn.default { border-color: rgba(45,212,168,0.25); }
    .time-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .time-grid .time-btn { text-align: center; }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 14px; }
    .primary-btn {
      background: rgba(45,212,168,0.14);
      border: 1px solid rgba(45,212,168,0.36);
      color: var(--green);
      border-radius: 12px;
      padding: 10px 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .ghost-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 12px;
      padding: 10px 14px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Top Navigation -->
  <nav class="topbar">
    <div class="brand">Social<span>Agent</span></div>
    <div class="nav-links">
      <a href="/">📅 Calendar</a>
      <a href="/feed" class="active">📊 Feed</a>
      <a href="/review">🃏 Swipe Review</a>
    </div>
    <div class="topbar-right">
      <span id="beastStatus" class="beast-status" style="font-size:11px;color:var(--text-dim);max-width:140px;text-align:right;"></span>
      <button type="button" id="startBeastBtn" class="beast-btn">Start Beast</button>
      <button type="button" class="scrape-btn" id="runScraperBtn">🔄 Run Scraper</button>
      <div id="totalBadge" style="font-size:12px;color:var(--text-dim);">Loading...</div>
    </div>
  </nav>

  <!-- Filter Bar -->
  <div class="filter-bar">
    <input class="search-box" id="searchInput" placeholder="Search posts by author, content..." />
    <div class="pill-group">
      <button class="pill-btn active" data-platform="">All</button>
      <button class="pill-btn ig" data-platform="instagram">📸 Instagram</button>
      <button class="pill-btn tw" data-platform="twitter">𝕏 Twitter</button>
      <button class="pill-btn yt" data-platform="youtube">▶ YouTube</button>
    </div>
    <select class="sort-select" id="sortSelect">
      <option value="newest">Newest first</option>
      <option value="interaction">Most interaction</option>
      <option value="score">Highest score</option>
      <option value="likes">Most likes</option>
      <option value="comments">Most comments</option>
      <option value="views">Most views</option>
    </select>
    <div class="stats-summary" id="statsSummary"></div>
  </div>

  <!-- X / Twitter account filters -->
  <div class="author-bar hidden" id="authorBar"></div>

  <!-- Post Feed -->
  <div class="feed-container" id="feedContainer">
    <div class="loading"><div class="spinner"></div>Loading posts...</div>
  </div>

  <!-- Schedule Modal -->
  <div class="modal-overlay" id="modalOverlay" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true">
      <div class="modal-head">
        <div class="modal-title" id="modalTitle">Schedule post</div>
        <button class="modal-close" id="modalCloseBtn" type="button">Esc</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <script>
    // ── State ──
    let allPosts = [];
    let sourceAccounts = {};
    let currentPlatform = '';
    let currentAuthor = '';
    let currentSearch = '';
    let currentSort = 'newest';

    // ── API ──
    async function fetchJson(url, opts) {
      const res = await fetch(url, opts);
      return res.json();
    }

    // ── Number Formatting ──
    function fmtNum(n) {
      if (n == null) return '0';
      n = Number(n);
      if (n >= 1_000_000) return (n / 1_000_000).toFixed(1) + 'M';
      if (n >= 1_000) return (n / 1_000).toFixed(1) + 'K';
      return n.toLocaleString();
    }

    // ── Platform Helpers ──
    const PLATFORM_ICONS = { instagram: '📸', twitter: '𝕏', youtube: '▶' };
    const PLATFORM_NAMES = { instagram: 'Instagram', twitter: 'X / Twitter', youtube: 'YouTube' };

    function postUrl(post) {
      if (post.post_url) return post.post_url;
      const p = (post.platform || '').toLowerCase();
      const a = post.author || '';
      if (p === 'instagram') return `https://www.instagram.com/${a}/`;
      if (p === 'twitter') return `https://x.com/${a}`;
      if (p === 'youtube') return `https://www.youtube.com/@${a}`;
      return '#';
    }

    function linkIcon(platform) {
      if (platform === 'instagram') return '🔗';
      if (platform === 'twitter') return '🔗';
      if (platform === 'youtube') return '🔗';
      return '🔗';
    }

    function fmtDate(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return iso.slice(0, 16).replace('T', ' ');
      return d.toLocaleString(undefined, {
        month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
      });
    }

    function interactionScore(post) {
      if (post.interaction_score != null) return Number(post.interaction_score);
      const likes = Number(post.likes || 0);
      const comments = Number(post.comments || 0);
      const shares = Number(post.shares || 0);
      const saves = Number(post.saves || 0);
      const views = Number(post.views || 0);
      return likes + comments * 3 + shares * 2 + saves * 2 + views * 0.01;
    }

    function renderAuthorBar() {
      const bar = document.getElementById('authorBar');
      const authors = sourceAccounts[currentPlatform] || [];
      if (!currentPlatform || !authors.length) {
        bar.classList.add('hidden');
        bar.innerHTML = '';
        return;
      }
      bar.classList.remove('hidden');
      const buttons = [
        `<button class="pill-btn ${currentAuthor ? '' : 'active'}" data-author="">All accounts</button>`,
        ...authors.map(a => {
          const active = currentAuthor.toLowerCase() === a.toLowerCase() ? 'active' : '';
          return `<button class="pill-btn tw ${active}" data-author="${a}">@${a}</button>`;
        })
      ].join('');
      bar.innerHTML = buttons;
      bar.querySelectorAll('.pill-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          currentAuthor = btn.dataset.author || '';
          renderAuthorBar();
          renderFeed();
        });
      });
    }

    function scoreClass(score) {
      if (score >= 50) return '';
      if (score >= 20) return 'mid';
      return 'low';
    }

    // ── Render Single Post Card ──
    function renderPostCard(post) {
      const p = (post.platform || '').toLowerCase();
      const url = postUrl(post);
      const score = Number(post.engagement_score || 0);
      const content = (post.content || '').slice(0, 280);
      const likes = Number(post.likes || 0);
      const comments = Number(post.comments || 0);
      const shares = Number(post.shares || 0);
      const saves = Number(post.saves || 0);
      const views = Number(post.views || 0);
      const status = (post.status || 'pending').toLowerCase();
      const mediaUrl = post.media_url || '';
      const id = post.id;

      let mediaHtml = '';
      if (mediaUrl) {
        mediaHtml = `
          <div class="post-media">
            <img src="${mediaUrl}" alt="Post media" loading="lazy"
                 onerror="this.parentElement.style.display='none'" />
          </div>`;
      }

      // Build analytics cells — only show non-zero or relevant ones
      let statCells = '';
      statCells += `<div class="stat-cell likes"><div class="stat-value">${fmtNum(likes)}</div><div class="stat-label">❤️ Likes</div></div>`;
      statCells += `<div class="stat-cell comments"><div class="stat-value">${fmtNum(comments)}</div><div class="stat-label">💬 Comments</div></div>`;
      statCells += `<div class="stat-cell shares"><div class="stat-value">${fmtNum(shares)}</div><div class="stat-label">🔁 Shares</div></div>`;
      if (saves > 0 || p === 'instagram' || p === 'twitter') {
        statCells += `<div class="stat-cell saves"><div class="stat-value">${fmtNum(saves)}</div><div class="stat-label">🔖 Saves</div></div>`;
      }
      if (views > 0 || p === 'youtube' || p === 'twitter') {
        statCells += `<div class="stat-cell views"><div class="stat-value">${fmtNum(views)}</div><div class="stat-label">👁 Views</div></div>`;
      }

      // Action buttons based on status
      let actionsHtml = '';
      if (status === 'pending') {
        actionsHtml = `
          <button class="action-btn approve" onclick="approvePost(${id})">✅ Approve</button>
          <button class="action-btn reject" onclick="rejectPost(${id})">✗ Reject</button>`;
      } else if (status === 'approved') {
        actionsHtml = `
          <button class="action-btn" onclick="postNow(${id})">🚀 Post Now</button>`;
      }

      return `
        <article class="post-card" id="post-${id}">
          <div class="post-header">
            <div class="platform-badge ${p}">${PLATFORM_ICONS[p] || '📝'}</div>
            <div class="post-meta">
              <div class="author">@${post.author || 'unknown'}</div>
              <div class="platform-name">${PLATFORM_NAMES[p] || p} · ${fmtDate(post.created_at)}</div>
            </div>
            <div class="post-score ${scoreClass(score)}">${score.toFixed(1)}</div>
          </div>

          <div class="post-link-wrap">
            <a class="post-link" href="${url}" target="_blank" rel="noopener">
              <span class="link-icon">${linkIcon(p)}</span>
              <span class="link-text">${url}</span>
              <span class="link-arrow">→</span>
            </a>
          </div>

          ${content ? `<div class="post-content">${content}</div>` : ''}
          ${mediaHtml}

          <div class="analytics-bar">${statCells}</div>

          <div class="post-actions">
            ${actionsHtml}
            <span class="post-status ${status}">${status}</span>
          </div>
        </article>`;
    }

    // ── Render Feed ──
    function renderFeed() {
      const container = document.getElementById('feedContainer');
      let filtered = allPosts.slice();

      // Filter by platform
      if (currentPlatform) {
        filtered = filtered.filter(p => (p.platform || '').toLowerCase() === currentPlatform);
      }

      // Filter by author account
      if (currentAuthor) {
        filtered = filtered.filter(p => (p.author || '').toLowerCase() === currentAuthor.toLowerCase());
      }

      // Filter by search
      if (currentSearch) {
        const q = currentSearch.toLowerCase();
        filtered = filtered.filter(p =>
          (p.content || '').toLowerCase().includes(q) ||
          (p.author || '').toLowerCase().includes(q) ||
          (p.platform || '').toLowerCase().includes(q)
        );
      }

      // Sort
      if (currentSort === 'interaction') {
        filtered.sort((a, b) => interactionScore(b) - interactionScore(a));
      } else if (currentSort === 'score') {
        filtered.sort((a, b) => Number(b.engagement_score || 0) - Number(a.engagement_score || 0));
      } else if (currentSort === 'likes') {
        filtered.sort((a, b) => Number(b.likes || 0) - Number(a.likes || 0));
      } else if (currentSort === 'comments') {
        filtered.sort((a, b) => Number(b.comments || 0) - Number(a.comments || 0));
      } else if (currentSort === 'views') {
        filtered.sort((a, b) => Number(b.views || 0) - Number(a.views || 0));
      } else {
        filtered.sort((a, b) => (b.created_at || '').localeCompare(a.created_at || ''));
      }

      // Stats summary
      const totalLikes = filtered.reduce((s, p) => s + Number(p.likes || 0), 0);
      const totalViews = filtered.reduce((s, p) => s + Number(p.views || 0), 0);
      document.getElementById('statsSummary').innerHTML =
        `<span><strong>${filtered.length}</strong> posts</span>` +
        `<span><strong>${fmtNum(totalLikes)}</strong> total likes</span>` +
        `<span><strong>${fmtNum(totalViews)}</strong> total views</span>`;

      if (!filtered.length) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="icon">📭</div>
            <p>No posts found. Run the scraper to fetch new content.</p>
          </div>`;
        return;
      }

      container.innerHTML = filtered.map(renderPostCard).join('');
    }

    // ── Actions ──
    async function approvePost(id) {
      const post = allPosts.find(p => Number(p.id) === Number(id));
      if (!post) return;
      openScheduleModal(post);
    }

    async function rejectPost(id) {
      await fetchJson('/api/posts/reject', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ post_id: id })
      });
      const card = document.getElementById(`post-${id}`);
      if (card) card.style.opacity = '0.5';
      await loadPosts();
    }

    async function postNow(id) {
      await fetchJson('/api/post-now', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ post_id: id })
      });
      await loadPosts();
    }

    // ── Modal Scheduling ──
    const modalOverlay = document.getElementById('modalOverlay');
    const modalBody = document.getElementById('modalBody');
    const modalTitle = document.getElementById('modalTitle');
    const modalCloseBtn = document.getElementById('modalCloseBtn');

    let modalSelectedTime = '';
    let modalSelectedDate = '';
    let modalPostId = null;

    function closeModal() {
      modalOverlay.classList.remove('open');
      modalOverlay.setAttribute('aria-hidden', 'true');
      modalBody.innerHTML = '';
      modalSelectedTime = '';
      modalSelectedDate = '';
      modalPostId = null;
    }

    function openModal() {
      modalOverlay.classList.add('open');
      modalOverlay.setAttribute('aria-hidden', 'false');
    }

    function isoToday() {
      const d = new Date();
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }

    function buildDateInput() {
      const today = isoToday();
      const max = new Date();
      max.setDate(max.getDate() + 7);
      const yyyy = max.getFullYear();
      const mm = String(max.getMonth() + 1).padStart(2, '0');
      const dd = String(max.getDate()).padStart(2, '0');
      const maxIso = `${yyyy}-${mm}-${dd}`;
      return `
        <div>
          <div style="font-size:12px;color:var(--text-dim);margin-bottom:6px;">Date</div>
          <input id="scheduleDate" type="date" value="${today}" min="${today}" max="${maxIso}"
                 style="width:100%;background:var(--bg-surface);border:1px solid var(--border);color:var(--text);border-radius:12px;padding:10px 12px;" />
        </div>`;
    }

    function renderTimeButtons(timeSlots) {
      if (!timeSlots || !timeSlots.length) {
        return `<div class="empty-state"><p>No time slots configured.</p></div>`;
      }
      const defaultSlot = timeSlots.find(t => t.is_default) || timeSlots[0];
      const others = timeSlots.filter(t => t.time !== defaultSlot.time);
      modalSelectedTime = defaultSlot.time;
      const defaultBtn = `
        <button class="time-btn default selected" id="time-${defaultSlot.time}" type="button" data-time="${defaultSlot.time}">
          ⭐ ${defaultSlot.display} <span style="color:var(--text-dim);font-weight:600;">(last used)</span>
        </button>`;
      const grid = others
        .map(t => `<button class="time-btn" type="button" data-time="${t.time}">${t.display}</button>`)
        .join('');
      return `
        <div class="schedule-grid">
          <div>
            <div style="font-size:12px;color:var(--text-dim);margin-bottom:6px;">Time</div>
            ${defaultBtn}
            <div class="time-grid" id="timeGrid" style="margin-top:8px;">${grid}</div>
          </div>
        </div>`;
    }

    function wireTimeSelection() {
      modalBody.querySelectorAll('button[data-time]').forEach(btn => {
        btn.addEventListener('click', () => {
          modalBody.querySelectorAll('button[data-time]').forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
          modalSelectedTime = btn.dataset.time;
        });
      });
    }

    async function openScheduleModal(post) {
      modalPostId = Number(post.id);
      modalTitle.textContent = `Schedule @${post.author || 'unknown'} (${(post.platform || '').toLowerCase()})`;
      openModal();

      modalBody.innerHTML = `<div class="loading"><div class="spinner"></div>Loading schedule options...</div>`;
      const pref = await fetchJson('/api/preferences');
      const timeSlots = (pref && pref.time_slots) || [];

      modalBody.innerHTML = `
        <div style="color:var(--text-muted);font-size:12.5px;line-height:1.5;margin-bottom:12px;">
          ${(post.content || '').slice(0, 180)}
        </div>
        ${buildDateInput()}
        <div style="height:10px"></div>
        ${renderTimeButtons(timeSlots)}
        <div class="modal-actions">
          <button class="ghost-btn" type="button" id="cancelSchedule">Cancel</button>
          <button class="primary-btn" type="button" id="confirmSchedule">Confirm schedule</button>
        </div>
      `;

      const dateInput = document.getElementById('scheduleDate');
      modalSelectedDate = (dateInput && dateInput.value) || isoToday();
      if (dateInput) {
        dateInput.addEventListener('change', () => {
          modalSelectedDate = dateInput.value;
        });
      }

      wireTimeSelection();

      document.getElementById('cancelSchedule').onclick = closeModal;
      document.getElementById('confirmSchedule').onclick = async () => {
        const payload = { post_id: modalPostId, date: modalSelectedDate, time: modalSelectedTime };
        const res = await fetchJson('/api/posts/schedule', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (res && res.ok) {
          closeModal();
          await loadPosts();
        }
      };
    }

    // ── Load Data ──
    async function loadPosts() {
      try {
        const qs = new URLSearchParams();
        if (currentPlatform) qs.set('platform', currentPlatform);
        if (currentAuthor) qs.set('author', currentAuthor);
        qs.set('sort', currentSort === 'interaction' ? 'interaction' : currentSort);
        const [posts, accounts] = await Promise.all([
          fetchJson(`/api/posts/feed?${qs.toString()}`),
          fetchJson('/api/source-accounts'),
        ]);
        allPosts = posts;
        sourceAccounts = accounts || {};
        document.getElementById('totalBadge').textContent = `${allPosts.length} posts`;
        renderAuthorBar();
        renderFeed();
      } catch (e) {
        document.getElementById('feedContainer').innerHTML =
          '<div class="empty-state"><div class="icon">⚠️</div><p>Failed to load posts.</p></div>';
      }
    }

    // ── Event Bindings ──
    document.querySelectorAll('.pill-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.pill-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentPlatform = btn.dataset.platform;
        currentAuthor = '';
        renderAuthorBar();
        renderFeed();
      });
    });

    document.getElementById('searchInput').addEventListener('input', e => {
      currentSearch = e.target.value;
      renderFeed();
    });

    document.getElementById('sortSelect').addEventListener('change', e => {
      currentSort = e.target.value;
      renderFeed();
    });

    // ── Scraper ──
    let scrapePollTimer = null;

    async function pollScrapeStatus() {
      const st = await fetchJson('/api/scrape/status');
      const btn = document.getElementById('runScraperBtn');
      if (st.running) {
        btn.disabled = true;
        btn.textContent = '⏳ Scraping…';
        return;
      }
      btn.disabled = false;
      btn.textContent = '🔄 Run Scraper';
      if (scrapePollTimer) {
        clearInterval(scrapePollTimer);
        scrapePollTimer = null;
      }
      if (st.last_error) {
        alert('Scraper failed: ' + st.last_error);
      } else if (st.last_finished) {
        await loadPosts();
      }
    }

    document.getElementById('runScraperBtn').onclick = async () => {
      const btn = document.getElementById('runScraperBtn');
      btn.disabled = true;
      btn.textContent = '⏳ Starting…';
      const res = await fetchJson('/api/scrape', { method: 'POST' });
      if (!res.ok) {
        alert(res.error || 'Could not start scraper.');
        btn.disabled = false;
        btn.textContent = '🔄 Run Scraper';
        return;
      }
      scrapePollTimer = setInterval(pollScrapeStatus, 4000);
      pollScrapeStatus();
    };

    // ── Init ──
    loadPosts();

    // ── Modal bindings ──
    modalCloseBtn.addEventListener('click', closeModal);
    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) closeModal();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });
  </script>
  <script src="/static/system.js"></script>
</body>
</html>
