<!doctype html>
<html lang="en" class="h-full bg-gray-900 text-white">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Social Agent — Review</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React and ReactDOM via CDN -->
  <script type="module" src="https://cdn.skypack.dev/react"></script>
  <script type="module" src="https://cdn.skypack.dev/react-dom/client"></script>
</head>
<body class="h-full flex flex-col overflow-hidden">
  <nav class="flex items-center justify-between px-6 py-3 bg-gray-800 border-b border-gray-700">
    <div class="text-xl font-bold">Review</div>
    <div id="progress" class="text-sm"></div>
  </nav>
  <div id="root" class="flex-1 overflow-hidden"></div>

  <!-- React, Framer Motion, and app code -->
  <script type="module">
    import React, { useState, useEffect } from "https://cdn.skypack.dev/react";
    import ReactDOM from "https://cdn.skypack.dev/react-dom/client";
    import { motion, AnimatePresence } from "https://cdn.skypack.dev/framer-motion";

    const PLATFORM_ICONS = {
      instagram: "📸",
      twitter: "𝕏",
      youtube: "▶",
    };

    const generateMockPosts = () => {
      const platforms = ["instagram", "twitter", "youtube"];
      const authors = {
        instagram: ["insta_user1", "insta_user2", "insta_user3"],
        twitter: ["tw_user1", "tw_user2", "tw_user3"],
        youtube: ["yt_user1", "yt_user2", "yt_user3"],
      };
      const posts = [];
      for (let i = 0; i < 12; i++) {
        const platform = platforms[i % platforms.length];
        const author = authors[platform][Math.floor(Math.random() * authors[platform].length)];
        const id = i + 1;
        const likes = Math.floor(Math.random() * 500);
        const comments = Math.floor(Math.random() * 200);
        const shares = Math.floor(Math.random() * 100);
        const saves = Math.floor(Math.random() * 50);
        const views = Math.floor(Math.random() * 5000);
        const content = `Sample post ${id} on ${platform}. Lorem ipsum dolor sit amet, consectetur adipiscing elit.`;
        const media_url = Math.random() < 0.6 ? `https://picsum.photos/seed/${id}/400/300` : "";
        const created_at = new Date(Date.now() - Math.random() * 1e9).toISOString();
        posts.push({ id, platform, author, content, media_url, likes, comments, shares, saves, views, created_at, status: "pending" });
      }
      return posts;
    };

    const interactionScore = (p) => {
      return p.likes + p.comments * 3 + p.shares * 2 + p.saves * 2 + p.views * 0.01;
    };

    const Card = ({ post }) => {
      const platformIcon = PLATFORM_ICONS[post.platform] || "📝";
      const score = interactionScore(post).toFixed(1);
      return (
        <div className="bg-gray-800 rounded-xl border border-gray-700 w-full max-h-[80vh] overflow-hidden shadow-lg flex flex-col relative">
          {/* Header */}
          <div className="flex items-center gap-2 p-4 border-b border-gray-700">
            <div className="bg-gray-600 text-lg rounded w-8 h-8 flex items-center justify-center">{platformIcon}</div>
            <div className="flex-1">
              <div className="font-medium">@{post.author}</div>
              <div className="text-xs text-gray-400">{new Date(post.created_at).toLocaleString()}</div>
            </div>
            <div className="text-sm font-semibold text-green-400">{score}</div>
          </div>

          {/* Content */}
          <div className="p-4 flex-1 overflow-y-auto text-sm">{post.content}</div>

          {/* Media */}
          {post.media_url && (
            <img src={post.media_url} alt="media" className="w-full h-48 object-cover border-t border-gray-700" />
          )}

          {/* Engagement */}
          <div className="grid grid-cols-5 gap-2 p-3 border-t border-gray-700 text-xs">
            <div className="text-center">
              <div className="font-bold">{post.likes}</div>
              <div>❤️</div>
            </div>
            <div className="text-center">
              <div className="font-bold">{post.comments}</div>
              <div>💬</div>
            </div>
            <div className="text-center">
              <div className="font-bold">{post.shares}</div>
              <div>🔁</div>
            </div>
            <div className="text-center">
              <div className="font-bold">{post.saves}</div>
              <div>🔖</div>
            </div>
            <div className="text-center">
              <div className="font-bold">{post.views}</div>
              <div>👁</div>
            </div>
          </div>

          {/* Status badge */}
          <div className="absolute top-2 right-2 bg-gray-700 text-xs px-2 py-1 rounded uppercase">{post.status}</div>
        </div>
      );
    };

    const App = () => {
      const [posts, setPosts] = useState(generateMockPosts());
      const [reviewed, setReviewed] = useState([]);
      const [platformFilter, setPlatformFilter] = useState("");
      const [sort, setSort] = useState("newest");

      const filtered = posts.filter(p => (platformFilter ? p.platform === platformFilter : true));

      const sorted = [...filtered];
      if (sort === "interaction") {
        sorted.sort((a, b) => interactionScore(b) - interactionScore(a));
      } else if (sort === "newest") {
        sorted.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
      } else if (sort === "likes") {
        sorted.sort((a, b) => b.likes - a.likes);
      }

      const topThree = sorted.slice(0, 3);

      const handleSwipe = (direction, post) => {
        const newStatus = direction === "right" ? "approved" : "rejected";
        const updated = { ...post, status: newStatus };
        setReviewed(prev => [...prev, updated]);
        setPosts(prev => prev.filter(p => p.id !== post.id));
      };

      // Update progress counter in nav
      useEffect(() => {
        const total = posts.length + reviewed.length;
        const done = reviewed.length;
        const progressEl = document.getElementById("progress");
        if (progressEl) progressEl.textContent = `${done} / ${total} reviewed`;
      }, [posts, reviewed]);

      if (sorted.length === 0 && reviewed.length === 0) {
        return (
          <div className="flex items-center justify-center h-full text-gray-400">
            No posts to review.
          </div>
        );
      }

      if (topThree.length === 0) {
        const approved = reviewed.filter(p => p.status === "approved").length;
        const rejected = reviewed.filter(p => p.status === "rejected").length;
        const breakdown = reviewed.reduce((acc, p) => {
          acc[p.platform] = (acc[p.platform] || 0) + 1;
          return acc;
        }, {});
        return (
          <div className="p-8">
            <h2 className="text-2xl font-bold mb-4">Review Summary</h2>
            <p className="mb-2">Approved: {approved}</p>
            <p className="mb-2">Rejected: {rejected}</p>
            <h3 className="font-semibold mt-4">By Platform</h3>
            <ul className="list-disc list-inside">
              {Object.entries(breakdown).map(([plat, cnt]) => (
                <li key={plat}>{plat}: {cnt}</li>
              ))}
            </ul>
          </div>
        );
      }

      return (
        <div className="flex flex-col items-center justify-center h-full relative">
          {/* Filter & sort bar */}
          <div className="absolute top-4 left-4 right-4 flex gap-2 items-center z-10">
            <select
              className="bg-gray-800 text-white rounded px-2 py-1"
              value={platformFilter}
              onChange={e => setPlatformFilter(e.target.value)}
            >
              <option value="">All Platforms</option>
              <option value="instagram">Instagram</option>
              <option value="twitter">Twitter</option>
              <option value="youtube">YouTube</option>
            </select>
            <select
              className="bg-gray-800 text-white rounded px-2 py-1"
              value={sort}
              onChange={e => setSort(e.target.value)}
            >
              <option value="newest">Newest</option>
              <option value="interaction">Most Interaction</option>
              <option value="likes">Most Likes</option>
            </select>
          </div>

          {/* Card stack */}
          <div className="w-full max-w-md h-[70vh] relative">
            <AnimatePresence>
              {topThree.map((post, index) => {
                const isTop = index === 0;
                const scale = [1, 0.95, 0.9][index];
                const y = [0, 8, 16][index];
                return (
                  <motion.div
                    key={post.id}
                    className="absolute inset-0 flex justify-center"
                    style={{ scale, y, zIndex: 10 - index }}
                    drag={isTop ? "x" : false}
                    dragConstraints={{ left: 0, right: 0 }}
                    dragElastic={1}
                    onDragEnd={(e, info) => {
                      const threshold = 150;
                      if (info.offset.x > threshold) handleSwipe("right", post);
                      else if (info.offset.x < -threshold) handleSwipe("left", post);
                    }}
                    whileTap={{ scale: 0.98 }}
                    transition={{ type: "spring", stiffness: 300, damping: 30 }}
                  >
                    <Card post={post} />
                  </motion.div>
                );
              })}
            </AnimatePresence>
          </div>

          {/* Action buttons */}
          {topThree[0] && (
            <div className="flex gap-6 mt-4">
              <button
                className="bg-red-600 text-white rounded-full w-12 h-12 flex items-center justify-center"
                onClick={() => handleSwipe("left", topThree[0])}
              >✗</button>
              <button
                className="bg-green-600 text-white rounded-full w-12 h-12 flex items-center justify-center"
                onClick={() => handleSwipe("right", topThree[0])}
              >✓</button>
            </div>
          )}
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
