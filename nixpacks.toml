# Railway / Nixpacks: Python app + Vite review UI build
[phases.setup]
nixPkgs = ["python313", "nodejs_20"]

[phases.install]
cmds = [
  "python -m venv /opt/venv",
  ". /opt/venv/bin/activate && pip install -r requirements.txt",
  "cd review-ui && npm install --prefer-offline",
]

[phases.build]
cmds = [". /opt/venv/bin/activate && python scripts/vercel_build.py"]

[start]
cmd = ". /opt/venv/bin/activate && SOCIAL_AGENT_BACKGROUND_SCHEDULER=false TELEGRAM_POLLING_ENABLED=false gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 120 --access-logfile - --error-logfile -"
