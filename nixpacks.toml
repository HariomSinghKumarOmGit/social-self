# Railway / Nixpacks — Python venv + Node review-ui build
[phases.setup]
nixPkgs = ["python313", "nodejs_20"]

[phases.install]
cmds = [
  "python3 -m venv /opt/venv",
  "/opt/venv/bin/python -m pip install --upgrade pip",
  "/opt/venv/bin/pip install -r requirements.txt",
  "cd review-ui && npm install",
]

[phases.build]
cmds = ["/opt/venv/bin/python scripts/vercel_build.py"]

[start]
cmd = "sh scripts/railway_start.sh"
