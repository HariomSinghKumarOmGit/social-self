[build]
builder = "NIXPACKS"

[deploy]
startCommand = ". /opt/venv/bin/activate && SOCIAL_AGENT_BACKGROUND_SCHEDULER=false TELEGRAM_POLLING_ENABLED=false gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 120 --access-logfile - --error-logfile -"
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
